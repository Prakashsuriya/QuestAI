services:
  - type: web
    name: questai
    runtime: python
    pythonVersion: 3.11.0
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///questionnaire_app.db
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
